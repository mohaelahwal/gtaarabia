name: Daily Arabic content
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-arabic-content
  cancel-in-progress: false
jobs:
  generate:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.commit.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate one sourced article
        env:
          AUTOMATION_ENABLED: 'true'
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
        run: npm run update
      - run: npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: content-drafts
          path: drafts/
          if-no-files-found: ignore
      - name: Commit validated public content
        id: commit
        env:
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
        run: |
          echo 'publish=false' >> "$GITHUB_OUTPUT"
          if [ "$AUTO_PUBLISH" != 'true' ]; then exit 0; fi
          git config user.name 'GTA Arabia Bot'
          git config user.email 'gta-arabia-bot@users.noreply.github.com'
          git add data/posts.json assets/ data/automation-state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Publish daily verified Arabic article'
          git push
          echo 'publish=true' >> "$GITHUB_OUTPUT"
  publish:
    needs: generate
    if: needs.generate.outputs.publish == 'true'
    uses: ./.github/workflows/pages.yml
