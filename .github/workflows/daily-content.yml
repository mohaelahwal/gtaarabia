name: Daily Arabic content
on:
  schedule:
    # Qatar is UTC+3 year round. GitHub may start scheduled jobs late.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Connection tests Groq; discovery checks publishers; draft previews; publish requires AUTO_PUBLISH=true.'
        type: choice
        options:
          - connection
          - discovery
          - draft
          - publish
        default: draft
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-arabic-content
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.commit.outputs.publish }}
    env:
      AI_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_TEXT_MODEL: ${{ vars.GROQ_TEXT_MODEL }}
      GROQ_VISION_MODEL: ${{ vars.GROQ_VISION_MODEL }}
      DISCOVERY_ONLY: ${{ inputs.mode == 'discovery' && 'true' || 'false' }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH == 'true' && (github.event_name == 'schedule' || inputs.mode == 'publish') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reset per-run request budget
        run: |
          rm -rf drafts
          mkdir -p drafts
      - name: Check Groq Arabic and image access
        id: connection
        if: inputs.mode == 'connection'
        run: node scripts/check-ai.mjs
      - name: Discover and review up to two new Arabic news articles
        if: inputs.mode != 'connection'
        env:
          AUTOMATION_ENABLED: 'true'
        run: npm run update
      - name: Discover and review one GTA VI leak from publisher feeds
        if: ${{ !cancelled() && inputs.mode != 'connection' }}
        env:
          AUTOMATION_ENABLED: 'true'
        run: node scripts/update-leaks.mjs
      - name: Validate website before publishing
        run: npm test && npm run build && npm run check:seo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-drafts-${{ github.run_number }}
          path: drafts/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit validated public content
        id: commit
        run: |
          echo 'publish=false' >> "$GITHUB_OUTPUT"
          if [ "$AUTO_PUBLISH" != 'true' ]; then exit 0; fi
          if ! node -e "const fs=require('fs');const ok=['drafts/report.json','drafts/leaks-report.json'].some(f=>fs.existsSync(f)&&JSON.parse(fs.readFileSync(f)).status==='ready-to-publish');process.exit(ok?0:1)"; then exit 0; fi
          git config user.name 'GTA Arabia Bot'
          git config user.email 'gta-arabia-bot@users.noreply.github.com'
          mkdir -p assets/discovered assets/leaks
          git add data/leaks.json automation/leak-sources.json data/posts.json data/videos.json data/catalog.json data/research.json data/map-locations.json assets/ data/automation-state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Publish verified Arabic content updates'
          git push
          echo 'publish=true' >> "$GITHUB_OUTPUT"
  publish:
    needs: generate
    if: needs.generate.outputs.publish == 'true'
    uses: ./.github/workflows/pages.yml
