name: Daily Arabic content
on:
  schedule:
    # Qatar is UTC+3 year round. GitHub may start scheduled jobs late.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Draft saves an Arabic preview; publish also requires AUTO_PUBLISH=true.'
        type: choice
        options:
          - draft
          - publish
        default: draft
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-arabic-content
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.commit.outputs.publish }}
    env:
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH == 'true' && (github.event_name == 'schedule' || inputs.mode == 'publish') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover and reconcile all seven content categories
        env:
          AUTOMATION_ENABLED: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
        run: npm run update
      - name: Validate website before publishing
        run: npm test && npm run build && npm run check:seo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-drafts-${{ github.run_number }}
          path: drafts/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit validated public content
        id: commit
        run: |
          echo 'publish=false' >> "$GITHUB_OUTPUT"
          if [ "$AUTO_PUBLISH" != 'true' ]; then exit 0; fi
          if ! node -e "const r=JSON.parse(require('fs').readFileSync('drafts/report.json'));process.exit(r.status==='ready-to-publish'?0:1)"; then exit 0; fi
          git config user.name 'GTA Arabia Bot'
          git config user.email 'gta-arabia-bot@users.noreply.github.com'
          mkdir -p assets/discovered
          git add data/posts.json data/videos.json data/catalog.json data/research.json data/map-locations.json assets/discovered/ data/automation-state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Publish verified Arabic content updates'
          git push
          echo 'publish=true' >> "$GITHUB_OUTPUT"
  publish:
    needs: generate
    if: needs.generate.outputs.publish == 'true'
    uses: ./.github/workflows/pages.yml
