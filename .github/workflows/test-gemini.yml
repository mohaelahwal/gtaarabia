name: Test Gemini connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test without Google Search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';

          const config = JSON.parse(
            fs.readFileSync('data/automation.json', 'utf8')
          );
          const model = process.env.GEMINI_TEXT_MODEL || config.textModel;
          const key = process.env.GEMINI_API_KEY;
          if (!key) throw new Error('GEMINI_API_KEY secret is missing.');

          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-goog-api-key': key
              },
              body: JSON.stringify({
                contents: [{ parts: [{ text: 'Reply with OK.' }] }]
              }),
              signal: AbortSignal.timeout(180000)
            }
          );

          const result = await response.json();
          console.log('Model:', model);
          console.log('HTTP status:', response.status);
          console.log(
            JSON.stringify(result, null, 2)
              .split(key).join('[REDACTED]')
          );
          if (!response.ok) process.exitCode = 1;
          JS
